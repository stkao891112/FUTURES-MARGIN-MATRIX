name: Daily Exchange Margin Matrix Auto-Crawl

on:
  schedule:
    # 每天台灣時間 08:00 AM (UTC 00:00) 自動執行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援在 GitHub Actions 頁面手動點擊「Run workflow」觸發

permissions:
  contents: write # 顯式授權 GITHUB_TOKEN 具備寫入與 Push 權限 (防止 403 錯誤)

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎭 Install Playwright Chromium Browser
        run: |
          playwright install chromium

      - name: 🚀 Run Multi-Exchange Parallel Crawlers (main.py)
        run: |
          xvfb-run python main.py

      - name: 📊 Export JSON & Sync index.html (export_json.py)
        run: |
          python export_json.py

      - name: 🔍 Check if Data Has Changed (檢查數據與顯示幣種/交易所變動細節)
        id: check_diff
        run: |
          python check_diff.py

      - name: 🛡️ Audit Alert (檢測到異動：安全停止自動 Commit，提示人工審查)
        if: steps.check_diff.outputs.has_changes == 'true'
        run: |
          echo "============================================================"
          echo "⚠️ 【安全保護提示】本次自動巡檢檢測到 7 大交易所數據有變動！"
          echo "🛡️ 已按照您的要求：【安全保護】已停止自動 Commit 與 Push 寫入儲存庫。"
          echo "👉 請查看 GitHub Actions 摘要頁面 (Summary) 的詳細變動報告。"
          echo "👉 確認異動無誤後，您可以再手動於本機執行爬蟲或更新推送。"
          echo "============================================================"
