name: Daily Exchange Margin Matrix Auto-Crawl

on:
  schedule:
    # 每天台灣時間 08:00 AM (UTC 00:00) 自動執行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援在 GitHub Actions 頁面手動點擊「Run workflow」觸發

permissions:
  contents: write # 顯式授權 GITHUB_TOKEN 具備寫入與 Push 權限 (防止 403 錯誤)

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎭 Install Playwright Chromium Browser
        run: |
          playwright install chromium

      - name: 🚀 Run Multi-Exchange Parallel Crawlers (main.py)
        run: |
          xvfb-run python main.py

      - name: 📊 Export JSON & Sync index.html (export_json.py)
        run: |
          python export_json.py

      - name: 🔍 Check if Data Has Changed (檢查數據與顯示變動細節)
        id: check_diff
        run: |
          echo "=========================================="
          echo "📊 檢查工作區變動檔案清單 (git status):"
          git status --short
          echo "=========================================="

          if git diff --name-only | grep -E 'data/tiers.json|data/all_exchanges_futures_margin.xlsx|index.html'; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✨ 檢測到交易所檔位數據有變動！變動檔案與統計數量如下："
            git diff --stat data/tiers.json index.html
            echo "------------------------------------------"
            echo "🔍 檔位 JSON 數據變動細節預覽 (Diff Preview):"
            git diff -U1 data/tiers.json | head -n 40
            echo "------------------------------------------"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 交易所數據無任何實質變動，跳過 Commit 與 Push。"
          fi

      - name: 💾 Commit & Push Changes (僅在數據有變動時執行)
        if: steps.check_diff.outputs.has_changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          git commit -m "🤖 [Auto-Crawl] 7大交易所檔位數據自動更新 ($(date +'%Y-%m-%d %H:%M:%S'))"
          git push
